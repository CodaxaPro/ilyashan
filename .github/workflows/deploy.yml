name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --scope treuepays-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --scope treuepays-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --scope treuepays-projects --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Prebuilt --prod sometimes leaves custom domains on an older deployment.
          vercel alias set "$url" ilyashan.de --scope treuepays-projects --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set "$url" www.ilyashan.de --scope treuepays-projects --token=${{ secrets.VERCEL_TOKEN }}
